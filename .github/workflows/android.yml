name: EASYCUT v0 Android CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publier une prerelease APK/AAB après CI"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Unit tests, lint and APK
        id: gradle_build
        shell: bash
        run: |
          set +e
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:bundleDebug --stacktrace 2>&1 | tee easycut-v0-build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Name Android outputs
        if: steps.gradle_build.outputs.status == '0'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk EASYCUT-v0-arm64-debug.apk
          cp app/build/outputs/bundle/debug/app-debug.aab EASYCUT-v0-arm64-debug.aab

      # GitHub Actions artifact storage is saturated for this account.
      # Publish temporary test builds in Releases instead of upload-artifact.
      - name: Publish test APK and AAB as GitHub prerelease
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/main' && steps.gradle_build.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          tag="easycut-v0-preview-${short_sha}"
          gh release create "$tag" \
            EASYCUT-v0-arm64-debug.apk \
            EASYCUT-v0-arm64-debug.aab \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "EASYCUT v0 — aperçu ${short_sha}" \
            --notes "Import FabVidEdit 0.25.6 (4366494). Compilation debug ARM64 : tests unitaires, lint, APK et AAB. Tests sur téléphone et conformité de l'aperçu non encore validés. Format de sortie MP4/AAC; prise en charge H.265 conditionnelle à l'encodeur matériel. Sources : ${GITHUB_SHA}."
